name: Copy GTA 3 Source Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-source:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Copy GTA 3 source repository'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: developwithAhsan/gta3-onlines
          ref: 32a7ab46aee4b70a9793e1e97e9162edeada2dcb
          path: source
          fetch-depth: 1

      - name: Copy complete source tree
        shell: bash
        run: |
          set -e
          cp target/.github/workflows/copy-source.yml /tmp/copy-source.yml
          rsync -a --delete --exclude='.git' source/ target/
          mkdir -p target/.github/workflows
          cp /tmp/copy-source.yml target/.github/workflows/copy-source.yml
          rm -f target/README.md

      - name: Commit copied repository
        working-directory: target
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy GTA 3 source repository"
          git push origin main
